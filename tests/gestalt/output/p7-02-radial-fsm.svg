<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 452 452"
     role="img"
     class="gestalt-root"
     data-margin="64"
     data-layout="radial"
     data-content-bbox="-164,-162.3,324,304.1"
     aria-label="FSM with cycle — radial layout (clock face)"
     tabindex="-1">
  <title>FSM with cycle — radial layout (clock face)</title>
  <desc>FSM with cycle — radial layout (clock face) — gestalt diagram</desc>
  <defs>
    <style>:root { 
  --bg: #181818; --bg-surface: #202020;
  --cyan: #00d8ff; --green: #4afa7a; --purple: #bd93f9; --pink: #ff79c6;
  --yellow: #f1fa8c; --orange: #ffb86c; --red: #ff5555;
  --accent: #bf7fff; --white: #f8f8f2; --dim: #6e6e6b;
  --font: 'Monaspace Neon', ui-monospace, monospace;
 } .gestalt-root { background: var(--bg); cursor: default; } 
    @container (max-width: 480px) { .gestalt-root .sublabel-stable { display: none; } }
    .g-node, .g-edge { transition: opacity 250ms ease-out; }
    .g-node.is-dimmed, .g-edge.is-dimmed { opacity: 0.28; }
    .g-node.is-pulsing { animation: gestalt-pulse 600ms ease-out; }
    @keyframes gestalt-pulse { 0%,100% { filter: none } 40% { filter: brightness(1.6) drop-shadow(0 0 6px currentColor) } }
  </style>
    
  <filter id="shadow-subtle" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.35"/>
  </filter>
  <filter id="shadow-lifted" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.5"/>
  </filter>

    <marker id="mk-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent)"/>
      </marker>
  </defs>
  <rect width="452" height="452" fill="var(--bg)"/>
  <g class="zoom-root">
    
    
    <g class="g-edge" data-id="idle-request">
    <path d="M 152.5 310.5 L 106 239" stroke="var(--accent)" stroke-width="1.25" fill="none" vector-effect="non-scaling-stroke" opacity="0.85" marker-end="url(#mk-arrow-accent)"/>
    
  </g><g class="g-edge" data-id="request-fetch">
    <path d="M 148 197 L 194 108" stroke="var(--accent)" stroke-width="1.25" fill="none" vector-effect="non-scaling-stroke" opacity="0.85" marker-end="url(#mk-arrow-accent)"/>
    
  </g><g class="g-edge" data-id="fetch-render">
    <path d="M 262 108 L 312 197" stroke="var(--accent)" stroke-width="1.25" fill="none" vector-effect="non-scaling-stroke" opacity="0.85" marker-end="url(#mk-arrow-accent)"/>
    
  </g><g class="g-edge" data-id="render-settle">
    <path d="M 350 235 L 303.5 302.5" stroke="var(--accent)" stroke-width="1.25" fill="none" vector-effect="non-scaling-stroke" opacity="0.85" marker-end="url(#mk-arrow-accent)"/>
    
  </g><g class="g-edge" data-id="settle-idle">
    <path d="M 265.5 340.5 L 182.5 340.5" stroke="var(--accent)" stroke-width="1.25" fill="none" vector-effect="non-scaling-stroke" opacity="0.85" marker-end="url(#mk-arrow-accent)"/>
    
  </g>
    
    <g class="g-node" data-id="idle" role="img" aria-label="idle">
      <title>idle</title>
      <circle cx="152.5" cy="340.5" r="30" fill="var(--bg-surface, #202020)" stroke="var(--dim)" stroke-width="1" vector-effect="non-scaling-stroke"/>
      <g class="screen-stable" transform="translate(152.5,344.5) scale(1)">
        <text text-anchor="middle" font-family="var(--font, monospace)" font-size="13" fill="var(--dim)">idle</text>
      </g>
      
    </g>
    <g class="g-node" data-id="request" role="img" aria-label="request">
      <title>request</title>
      <circle cx="106" cy="197" r="42" fill="var(--bg-surface, #202020)" stroke="var(--accent)" stroke-width="1" vector-effect="non-scaling-stroke"/>
      <g class="screen-stable" transform="translate(106,201) scale(1)">
        <text text-anchor="middle" font-family="var(--font, monospace)" font-size="13" fill="var(--accent)">request</text>
      </g>
      
    </g>
    <g class="g-node" data-id="fetch" role="img" aria-label="fetch">
      <title>fetch</title>
      <circle cx="228" cy="108" r="34" fill="var(--bg-surface, #202020)" stroke="var(--cyan)" stroke-width="1" vector-effect="non-scaling-stroke"/>
      <g class="screen-stable" transform="translate(228,112) scale(1)">
        <text text-anchor="middle" font-family="var(--font, monospace)" font-size="13" fill="var(--cyan)">fetch</text>
      </g>
      
    </g>
    <g class="g-node" data-id="render" role="img" aria-label="render">
      <title>render</title>
      <circle cx="350" cy="197" r="38" fill="var(--bg-surface, #202020)" stroke="var(--green)" stroke-width="1" vector-effect="non-scaling-stroke"/>
      <g class="screen-stable" transform="translate(350,201) scale(1)">
        <text text-anchor="middle" font-family="var(--font, monospace)" font-size="13" fill="var(--green)">render</text>
      </g>
      
    </g>
    <g class="g-node" data-id="settle" role="img" aria-label="settle">
      <title>settle</title>
      <circle cx="303.5" cy="340.5" r="38" fill="var(--bg-surface, #202020)" stroke="var(--accent)" stroke-width="1" vector-effect="non-scaling-stroke"/>
      <g class="screen-stable" transform="translate(303.5,344.5) scale(1)">
        <text text-anchor="middle" font-family="var(--font, monospace)" font-size="13" fill="var(--accent)">settle</text>
      </g>
      
    </g>
  </g>
  
  
  
</svg>