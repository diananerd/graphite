<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 288"
     role="img"
     class="gestalt-root"
     data-margin="48"
     data-layout="sugiyama-lr"
     data-content-bbox="0,-96,400,192"
     aria-label="Block diagram — orthogonal manhattan edges"
     tabindex="-1">
  <title>Block diagram — orthogonal manhattan edges</title>
  <desc>Block diagram — orthogonal manhattan edges — gestalt diagram</desc>
  <defs>
    <style>:root { 
  --bg: #181818; --bg-surface: #202020;
  --cyan: #00d8ff; --green: #4afa7a; --purple: #bd93f9; --pink: #ff79c6;
  --yellow: #f1fa8c; --orange: #ffb86c; --red: #ff5555;
  --accent: #bf7fff; --white: #f8f8f2; --dim: #6e6e6b;
  --font: 'Monaspace Neon', ui-monospace, monospace;
 } .gestalt-root { background: var(--bg); cursor: default; } 
    @container (max-width: 480px) { .gestalt-root .sublabel-stable { display: none; } }
    .g-node, .g-edge { transition: opacity 250ms ease-out; }
    .g-node.is-dimmed, .g-edge.is-dimmed { opacity: 0.28; }
    .g-node.is-pulsing { animation: gestalt-pulse 600ms ease-out; }
    @keyframes gestalt-pulse { 0%,100% { filter: none } 40% { filter: brightness(1.6) drop-shadow(0 0 6px currentColor) } }
    .gestalt-root[data-node-steps] .g-node { cursor: pointer; }
    .ctrl-btn[data-action="autoplay-toggle"] .icon-pause { display: none; }
    .gestalt-root[data-autoplay="1"] .ctrl-btn[data-action="autoplay-toggle"] .icon-play { display: none; }
    .gestalt-root[data-autoplay="1"] .ctrl-btn[data-action="autoplay-toggle"] .icon-pause { display: block; }
  </style>
    
  <filter id="shadow-subtle" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.35"/>
  </filter>
  <filter id="shadow-lifted" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.5"/>
  </filter>

    <marker id="mk-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent)"/>
      </marker><marker id="mk-arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--purple)"/>
      </marker>
  </defs>
  <rect width="512" height="288" fill="var(--bg)"/>
  <g class="zoom-root">
    
    
    <g class="g-edge" data-id="gw-auth">
    <path d="M 152 144 L 184 144 L 184 88 L 216 88" stroke="var(--accent)" stroke-width="1.25" fill="none" vector-effect="non-scaling-stroke" opacity="0.85" marker-end="url(#mk-arrow-accent)"/>
    
  </g><g class="g-edge" data-id="gw-users">
    <path d="M 152 144 L 184 144 L 184 200 L 216 200" stroke="var(--accent)" stroke-width="1.25" fill="none" vector-effect="non-scaling-stroke" opacity="0.85" marker-end="url(#mk-arrow-accent)"/>
    
  </g><g class="g-edge" data-id="auth-store">
    <path d="M 312 88 L 344 88 L 344 144 L 376 144" stroke="var(--purple)" stroke-width="1.25" fill="none" vector-effect="non-scaling-stroke" opacity="0.85" marker-end="url(#mk-arrow-purple)"/>
    
  </g><g class="g-edge" data-id="users-store">
    <path d="M 312 200 L 344 200 L 344 144 L 376 144" stroke="var(--purple)" stroke-width="1.25" fill="none" vector-effect="non-scaling-stroke" opacity="0.85" marker-end="url(#mk-arrow-purple)"/>
    
  </g>
    
    <g class="g-node" data-id="gw" role="img" aria-label="Gateway">
      <title>Gateway</title>
      <rect x="56" y="116" width="96" height="56" rx="0" fill="var(--bg-surface, #202020)" stroke="var(--accent)" stroke-width="1" vector-effect="non-scaling-stroke"/>
      <g class="screen-stable" transform="translate(104,148) scale(1)">
        <text text-anchor="middle" font-family="var(--font, monospace)" font-size="13" fill="var(--accent)">Gateway</text>
      </g>
      
    </g>
    <g class="g-node" data-id="auth" role="img" aria-label="Auth">
      <title>Auth</title>
      <polygon points="240,48 288,48 312,88 288,128 240,128 216,88" fill="var(--bg-surface, #202020)" stroke="var(--cyan)" stroke-width="1" vector-effect="non-scaling-stroke"/>
      <g class="screen-stable" transform="translate(264,92) scale(1)">
        <text text-anchor="middle" font-family="var(--font, monospace)" font-size="13" fill="var(--cyan)">Auth</text>
      </g>
      
    </g>
    <g class="g-node" data-id="users" role="img" aria-label="Users">
      <title>Users</title>
      <polygon points="240,160 288,160 312,200 288,240 240,240 216,200" fill="var(--bg-surface, #202020)" stroke="var(--cyan)" stroke-width="1" vector-effect="non-scaling-stroke"/>
      <g class="screen-stable" transform="translate(264,204) scale(1)">
        <text text-anchor="middle" font-family="var(--font, monospace)" font-size="13" fill="var(--cyan)">Users</text>
      </g>
      
    </g>
    <g class="g-node" data-id="store" role="img" aria-label="Store">
      <title>Store</title>
      
        <path d="M 376 108 A 40 12 0 0 0 456 108 L 456 180 A 40 12 0 0 1 376 180 Z" fill="var(--bg-surface, #202020)" stroke="var(--purple)" stroke-width="1" vector-effect="non-scaling-stroke"/>
        <ellipse cx="416" cy="108" rx="40" ry="12" fill="var(--bg-surface, #202020)" stroke="var(--purple)" stroke-width="1" vector-effect="non-scaling-stroke"/>
      <g class="screen-stable" transform="translate(416,148) scale(1)">
        <text text-anchor="middle" font-family="var(--font, monospace)" font-size="13" fill="var(--purple)">Store</text>
      </g>
      
    </g>
  </g>
  
  
  
</svg>