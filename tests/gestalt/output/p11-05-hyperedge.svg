<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 556 313"
     role="img"
     class="gestalt-root"
     data-margin="36"
     data-layout="grid"
     data-content-bbox="0,0,484,96"
     aria-label="Hyperedge — n-ary join via central junction"
     tabindex="-1">
  <title>Hyperedge — n-ary join via central junction</title>
  <desc>Hyperedge — n-ary join via central junction — gestalt diagram</desc>
  <defs>
    <style>:root { 
  --bg: #181818; --bg-surface: #202020;
  --cyan: #00d8ff; --green: #4afa7a; --purple: #bd93f9; --pink: #ff79c6;
  --yellow: #f1fa8c; --orange: #ffb86c; --red: #ff5555;
  --accent: #bf7fff; --white: #f8f8f2; --dim: #6e6e6b;
  --font: 'Monaspace Neon', ui-monospace, monospace;
 } .gestalt-root { background: var(--bg); cursor: default; } 
    @container (max-width: 480px) { .gestalt-root .sublabel-stable { display: none; } }
    .g-node, .g-edge { transition: opacity 250ms ease-out; }
    .g-node.is-dimmed, .g-edge.is-dimmed { opacity: 0.28; }
    .g-node.is-pulsing { animation: gestalt-pulse 600ms ease-out; }
    @keyframes gestalt-pulse { 0%,100% { filter: none } 40% { filter: brightness(1.6) drop-shadow(0 0 6px currentColor) } }
    .gestalt-root[data-node-steps] .g-node { cursor: pointer; }
    .ctrl-btn[data-action="autoplay-toggle"] .icon-pause { display: none; }
    .gestalt-root[data-autoplay="1"] .ctrl-btn[data-action="autoplay-toggle"] .icon-play { display: none; }
    .gestalt-root[data-autoplay="1"] .ctrl-btn[data-action="autoplay-toggle"] .icon-pause { display: block; }
    .ctrl-btn[data-action="loop-toggle"] { opacity: 0.5; }
    .gestalt-root[data-loop="1"] .ctrl-btn[data-action="loop-toggle"] { opacity: 1; }
    .gestalt-root[data-chrome="0"] .controls-bar,
    .gestalt-root[data-chrome="0"] .caption-bar,
    .gestalt-root[data-chrome="0"] .step-counter { opacity: 0; pointer-events: none; transition: opacity 180ms ease-out; }
    .gestalt-root[data-chrome="1"] .controls-bar,
    .gestalt-root[data-chrome="1"] .caption-bar,
    .gestalt-root[data-chrome="1"] .step-counter { transition: opacity 180ms ease-out; }
    .gestalt-root:fullscreen { width: 100vw; height: 100vh; background: var(--bg); }
    .gestalt-root::backdrop { background: var(--bg); }
    /* A11y: visible focus ring for keyboard navigation. */
    .gestalt-root:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
    .gestalt-root:focus:not(:focus-visible) { outline: none; }
    .ctrl-btn:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
    .ctrl-btn:focus:not(:focus-visible) { outline: none; }
    /* A11y: respect prefers-reduced-motion — animations and step transitions
       collapse to instant updates so users sensitive to motion can still
       follow the sequence without vestibular discomfort. */
    @media (prefers-reduced-motion: reduce) {
      .g-node, .g-edge, .controls-bar, .caption-bar, .step-counter,
      .g-node.is-pulsing { transition: none !important; animation: none !important; }
    }
  </style>
    
  <filter id="shadow-subtle" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.35"/>
  </filter>
  <filter id="shadow-lifted" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.5"/>
  </filter>

    <marker id="mk-arrow-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--yellow)"/>
      </marker>
  </defs>
  <rect width="556" height="313" fill="var(--bg)"/>
  <g class="zoom-root">
    
    
    <g class="g-hyperedge" data-id="hyper-h-src1-src2-src3-sink" role="img" aria-label="hyperedge merge">
    <path d="M 84 156.5 L 276.5 156.5" stroke="var(--yellow)" stroke-width="1.25" fill="none" vector-effect="non-scaling-stroke" opacity="0.8"/><path d="M 212 156.5 L 276.5 156.5" stroke="var(--yellow)" stroke-width="1.25" fill="none" vector-effect="non-scaling-stroke" opacity="0.8"/><path d="M 340 156.5 L 276.5 156.5" stroke="var(--yellow)" stroke-width="1.25" fill="none" vector-effect="non-scaling-stroke" opacity="0.8"/><path d="M 470 156.5 L 276.5 156.5" stroke="var(--yellow)" stroke-width="1.25" fill="none" vector-effect="non-scaling-stroke" opacity="0.8"/>
    <circle cx="276.5" cy="156.5" r="6" fill="var(--yellow)" stroke="var(--bg)" stroke-width="2"/>
    <g class="screen-stable edge-label" transform="translate(276.5,142.5) scale(1)">
    <rect x="-20.5" y="-8.0" width="41.0" height="16.0" rx="2" fill="var(--bg)"/>
    <text text-anchor="middle" dy=".35em" font-family="var(--font, monospace)" font-size="10" fill="var(--yellow)">merge</text>
  </g>
  </g>
    
    <g class="g-node" data-id="src1" role="img" aria-label="source A">
      <title>source A</title>
      <rect x="36" y="128.5" width="96" height="56" rx="0" fill="var(--bg-surface, #202020)" stroke="var(--accent)" stroke-width="1" vector-effect="non-scaling-stroke"/>
      <g class="screen-stable" transform="translate(84,160.5) scale(1)">
        <text text-anchor="middle" font-family="var(--font, monospace)" font-size="13" fill="var(--accent)">source A</text>
      </g>
      
    </g>
    <g class="g-node" data-id="src2" role="img" aria-label="source B">
      <title>source B</title>
      <rect x="164" y="128.5" width="96" height="56" rx="0" fill="var(--bg-surface, #202020)" stroke="var(--accent)" stroke-width="1" vector-effect="non-scaling-stroke"/>
      <g class="screen-stable" transform="translate(212,160.5) scale(1)">
        <text text-anchor="middle" font-family="var(--font, monospace)" font-size="13" fill="var(--accent)">source B</text>
      </g>
      
    </g>
    <g class="g-node" data-id="src3" role="img" aria-label="source C">
      <title>source C</title>
      <rect x="292" y="128.5" width="96" height="56" rx="0" fill="var(--bg-surface, #202020)" stroke="var(--accent)" stroke-width="1" vector-effect="non-scaling-stroke"/>
      <g class="screen-stable" transform="translate(340,160.5) scale(1)">
        <text text-anchor="middle" font-family="var(--font, monospace)" font-size="13" fill="var(--accent)">source C</text>
      </g>
      
    </g>
    <g class="g-node" data-id="sink" role="img" aria-label="warehouse">
      <title>warehouse</title>
      
        <path d="M 420 120.5 A 50 12 0 0 0 520 120.5 L 520 192.5 A 50 12 0 0 1 420 192.5 Z" fill="var(--bg-surface, #202020)" stroke="var(--purple)" stroke-width="1" vector-effect="non-scaling-stroke"/>
        <ellipse cx="470" cy="120.5" rx="50" ry="12" fill="var(--bg-surface, #202020)" stroke="var(--purple)" stroke-width="1" vector-effect="non-scaling-stroke"/>
      <g class="screen-stable" transform="translate(470,160.5) scale(1)">
        <text text-anchor="middle" font-family="var(--font, monospace)" font-size="13" fill="var(--purple)">warehouse</text>
      </g>
      
    </g>
  </g>
  
  
  
  
</svg>