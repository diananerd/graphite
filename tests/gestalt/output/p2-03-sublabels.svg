<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 568 319.5"
     role="img"
     class="gestalt-root"
     data-margin="36"
     data-layout="pass-through"
     data-content-bbox="-48,-28,496,56"
     aria-label="Sublabels expand vertical extent"
     tabindex="-1">
  <title>Sublabels expand vertical extent</title>
  <desc>Sublabels expand vertical extent — gestalt diagram</desc>
  <defs>
    <style>:root { 
  --bg: #181818; --bg-surface: #202020;
  --cyan: #00d8ff; --green: #4afa7a; --purple: #bd93f9; --pink: #ff79c6;
  --yellow: #f1fa8c; --orange: #ffb86c; --red: #ff5555;
  --accent: #bf7fff; --white: #f8f8f2; --dim: #6e6e6b;
  --font: 'Monaspace Neon', ui-monospace, monospace;
 } .gestalt-root { background: var(--bg); cursor: default; } 
    @container (max-width: 480px) { .gestalt-root .sublabel-stable { display: none; } }
    .g-node, .g-edge { transition: opacity 250ms ease-out; }
    .g-node.is-dimmed, .g-edge.is-dimmed { opacity: 0.28; }
    .g-node.is-pulsing { animation: gestalt-pulse 600ms ease-out; }
    @keyframes gestalt-pulse { 0%,100% { filter: none } 40% { filter: brightness(1.6) drop-shadow(0 0 6px currentColor) } }
    .gestalt-root[data-node-steps] .g-node { cursor: pointer; }
    .ctrl-btn[data-action="autoplay-toggle"] .icon-pause { display: none; }
    .gestalt-root[data-autoplay="1"] .ctrl-btn[data-action="autoplay-toggle"] .icon-play { display: none; }
    .gestalt-root[data-autoplay="1"] .ctrl-btn[data-action="autoplay-toggle"] .icon-pause { display: block; }
  </style>
    
  <filter id="shadow-subtle" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.35"/>
  </filter>
  <filter id="shadow-lifted" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.5"/>
  </filter>

    <marker id="mk-arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--cyan)"/>
      </marker><marker id="mk-arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--purple)"/>
      </marker>
  </defs>
  <rect width="568" height="319.5" fill="var(--bg)"/>
  <g class="zoom-root">
    
    
    <g class="g-edge" data-id="a-b">
    <path d="M 132 160 L 236 160" stroke="var(--cyan)" stroke-width="1.25" fill="none" vector-effect="non-scaling-stroke" opacity="0.85" marker-end="url(#mk-arrow-cyan)"/>
    
  </g><g class="g-edge" data-id="b-c">
    <path d="M 332 160 L 436 160" stroke="var(--purple)" stroke-width="1.25" fill="none" vector-effect="non-scaling-stroke" opacity="0.85" marker-end="url(#mk-arrow-purple)"/>
    
  </g>
    
    <g class="g-node" data-id="a" role="img" aria-label="API">
      <title>API</title>
      <rect x="36" y="132" width="96" height="56" rx="8" fill="var(--bg-surface, #202020)" stroke="var(--accent)" stroke-width="1" vector-effect="non-scaling-stroke"/>
      <g class="screen-stable" transform="translate(84,164) scale(1)">
        <text text-anchor="middle" font-family="var(--font, monospace)" font-size="13" fill="var(--accent)">API</text>
      </g>
      
    </g>
    <g class="g-node" data-id="b" role="img" aria-label="Worker">
      <title>Worker</title>
      <rect x="236" y="132" width="96" height="56" rx="8" fill="var(--bg-surface, #202020)" stroke="var(--cyan)" stroke-width="1" vector-effect="non-scaling-stroke"/>
      <g class="screen-stable" transform="translate(284,164) scale(1)">
        <text text-anchor="middle" font-family="var(--font, monospace)" font-size="13" fill="var(--cyan)">Worker</text>
      </g>
      
    </g>
    <g class="g-node" data-id="c" role="img" aria-label="Store">
      <title>Store</title>
      <rect x="436" y="132" width="96" height="56" rx="8" fill="var(--bg-surface, #202020)" stroke="var(--purple)" stroke-width="1" vector-effect="non-scaling-stroke"/>
      <g class="screen-stable" transform="translate(484,164) scale(1)">
        <text text-anchor="middle" font-family="var(--font, monospace)" font-size="13" fill="var(--purple)">Store</text>
      </g>
      
    </g>
  </g>
  
  
  
</svg>