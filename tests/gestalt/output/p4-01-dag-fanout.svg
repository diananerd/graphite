<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 483.5 272"
     role="img"
     class="gestalt-root"
     data-margin="48"
     data-layout="tree-tb"
     data-content-bbox="0,0,352,176"
     aria-label="1→3 fan-out DAG, auto-Sugiyama LR"
     tabindex="-1">
  <title>1→3 fan-out DAG, auto-Sugiyama LR</title>
  <desc>1→3 fan-out DAG, auto-Sugiyama LR — gestalt diagram</desc>
  <defs>
    <style>:root { 
  --bg: #181818; --bg-surface: #202020;
  --cyan: #00d8ff; --green: #4afa7a; --purple: #bd93f9; --pink: #ff79c6;
  --yellow: #f1fa8c; --orange: #ffb86c; --red: #ff5555;
  --accent: #bf7fff; --white: #f8f8f2; --dim: #6e6e6b;
  --font: 'Monaspace Neon', ui-monospace, monospace;
 } .gestalt-root { background: var(--bg); cursor: default; } 
    @container (max-width: 480px) { .gestalt-root .sublabel-stable { display: none; } }
  </style>
    
  <filter id="shadow-subtle" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.35"/>
  </filter>
  <filter id="shadow-lifted" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.5"/>
  </filter>

    <marker id="mk-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent)"/>
      </marker>
  </defs>
  <rect width="483.5" height="272" fill="var(--bg)"/>
  <g class="zoom-root">
    
    
    <g class="g-edge" data-id="src-a">
    <path d="M 242 104 L 114 168" stroke="var(--accent)" stroke-width="1.25" fill="none" vector-effect="non-scaling-stroke" opacity="0.85" marker-end="url(#mk-arrow-accent)"/>
    
  </g><g class="g-edge" data-id="src-b">
    <path d="M 242 104 L 242 168" stroke="var(--accent)" stroke-width="1.25" fill="none" vector-effect="non-scaling-stroke" opacity="0.85" marker-end="url(#mk-arrow-accent)"/>
    
  </g><g class="g-edge" data-id="src-c">
    <path d="M 242 104 L 370 168" stroke="var(--accent)" stroke-width="1.25" fill="none" vector-effect="non-scaling-stroke" opacity="0.85" marker-end="url(#mk-arrow-accent)"/>
    
  </g>
    
    <g class="g-node" data-id="src" role="img" aria-label="Publisher">
      <title>Publisher</title>
      <rect x="192" y="48" width="100" height="56" rx="8" fill="var(--bg-surface, #202020)" stroke="var(--accent)" stroke-width="1" vector-effect="non-scaling-stroke"/>
      <g class="screen-stable" transform="translate(242,80) scale(1)">
        <text text-anchor="middle" font-family="var(--font, monospace)" font-size="13" fill="var(--accent)">Publisher</text>
      </g>
      
    </g>
    <g class="g-node" data-id="a" role="img" aria-label="Sub A">
      <title>Sub A</title>
      <rect x="66" y="168" width="96" height="56" rx="8" fill="var(--bg-surface, #202020)" stroke="var(--cyan)" stroke-width="1" vector-effect="non-scaling-stroke"/>
      <g class="screen-stable" transform="translate(114,200) scale(1)">
        <text text-anchor="middle" font-family="var(--font, monospace)" font-size="13" fill="var(--cyan)">Sub A</text>
      </g>
      
    </g>
    <g class="g-node" data-id="b" role="img" aria-label="Sub B">
      <title>Sub B</title>
      <rect x="194" y="168" width="96" height="56" rx="8" fill="var(--bg-surface, #202020)" stroke="var(--green)" stroke-width="1" vector-effect="non-scaling-stroke"/>
      <g class="screen-stable" transform="translate(242,200) scale(1)">
        <text text-anchor="middle" font-family="var(--font, monospace)" font-size="13" fill="var(--green)">Sub B</text>
      </g>
      
    </g>
    <g class="g-node" data-id="c" role="img" aria-label="Sub C">
      <title>Sub C</title>
      <rect x="322" y="168" width="96" height="56" rx="8" fill="var(--bg-surface, #202020)" stroke="var(--yellow)" stroke-width="1" vector-effect="non-scaling-stroke"/>
      <g class="screen-stable" transform="translate(370,200) scale(1)">
        <text text-anchor="middle" font-family="var(--font, monospace)" font-size="13" fill="var(--yellow)">Sub C</text>
      </g>
      
    </g>
