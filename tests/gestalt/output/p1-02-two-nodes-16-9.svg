<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 392 220.5"
     role="img"
     class="gestalt-root"
     data-margin="48"
     data-layout="pass-through"
     data-content-bbox="-48,-28,296,56"
     aria-label="Two nodes, 16:9 — must centre"
     tabindex="-1">
  <title>Two nodes, 16:9 — must centre</title>
  <desc>Two nodes, 16:9 — must centre — gestalt diagram</desc>
  <defs>
    <style>:root { 
  --bg: #181818; --bg-surface: #202020;
  --cyan: #00d8ff; --green: #4afa7a; --purple: #bd93f9; --pink: #ff79c6;
  --yellow: #f1fa8c; --orange: #ffb86c; --red: #ff5555;
  --accent: #bf7fff; --white: #f8f8f2; --dim: #6e6e6b;
  --font: 'Monaspace Neon', ui-monospace, monospace;
 } .gestalt-root { background: var(--bg); cursor: default; } 
    @container (max-width: 480px) { .gestalt-root .sublabel-stable { display: none; } }
    .g-node, .g-edge { transition: opacity 250ms ease-out; }
    .g-node.is-dimmed, .g-edge.is-dimmed { opacity: 0.28; }
    .g-node.is-pulsing { animation: gestalt-pulse 600ms ease-out; }
    @keyframes gestalt-pulse { 0%,100% { filter: none } 40% { filter: brightness(1.6) drop-shadow(0 0 6px currentColor) } }
  </style>
    
  <filter id="shadow-subtle" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.35"/>
  </filter>
  <filter id="shadow-lifted" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.5"/>
  </filter>

    <marker id="mk-arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--cyan)"/>
      </marker>
  </defs>
  <rect width="392" height="220.5" fill="var(--bg)"/>
  <g class="zoom-root">
    
    
    <g class="g-edge" data-id="a-b">
    <path d="M 144 110.5 L 248 110.5" stroke="var(--cyan)" stroke-width="1.25" fill="none" vector-effect="non-scaling-stroke" opacity="0.85" marker-end="url(#mk-arrow-cyan)"/>
    
  </g>
    
    <g class="g-node" data-id="a" role="img" aria-label="client">
      <title>client</title>
      <rect x="48" y="82.5" width="96" height="56" rx="8" fill="var(--bg-surface, #202020)" stroke="var(--accent)" stroke-width="1" vector-effect="non-scaling-stroke"/>
      <g class="screen-stable" transform="translate(96,114.5) scale(1)">
        <text text-anchor="middle" font-family="var(--font, monospace)" font-size="13" fill="var(--accent)">client</text>
      </g>
      
    </g>
    <g class="g-node" data-id="b" role="img" aria-label="server">
      <title>server</title>
      <rect x="248" y="82.5" width="96" height="56" rx="8" fill="var(--bg-surface, #202020)" stroke="var(--cyan)" stroke-width="1" vector-effect="non-scaling-stroke"/>
      <g class="screen-stable" transform="translate(296,114.5) scale(1)">
        <text text-anchor="middle" font-family="var(--font, monospace)" font-size="13" fill="var(--cyan)">server</text>
      </g>
      
    </g>
  </g>
  
  
  
</svg>