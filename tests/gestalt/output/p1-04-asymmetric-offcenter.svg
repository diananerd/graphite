<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 560 315"
     role="img"
     class="gestalt-root"
     data-margin="36"
     data-layout="pass-through"
     data-content-bbox="952,906,488,222"
     aria-label="Off-centre virtual coords — engine must re-centre"
     tabindex="-1">
  <title>Off-centre virtual coords — engine must re-centre</title>
  <desc>Off-centre virtual coords — engine must re-centre — gestalt diagram</desc>
  <defs>
    <style>:root { 
  --bg: #181818; --bg-surface: #202020;
  --cyan: #00d8ff; --green: #4afa7a; --purple: #bd93f9; --pink: #ff79c6;
  --yellow: #f1fa8c; --orange: #ffb86c; --red: #ff5555;
  --accent: #bf7fff; --white: #f8f8f2; --dim: #6e6e6b;
  --font: 'Monaspace Neon', ui-monospace, monospace;
 } .gestalt-root { background: var(--bg); cursor: default; } 
    @container (max-width: 480px) { .gestalt-root .sublabel-stable { display: none; } }
    .g-node, .g-edge { transition: opacity 250ms ease-out; }
    .g-node.is-dimmed, .g-edge.is-dimmed { opacity: 0.28; }
    .g-node.is-pulsing { animation: gestalt-pulse 600ms ease-out; }
    @keyframes gestalt-pulse { 0%,100% { filter: none } 40% { filter: brightness(1.6) drop-shadow(0 0 6px currentColor) } }
    .gestalt-root[data-node-steps] .g-node { cursor: pointer; }
    .ctrl-btn[data-action="autoplay-toggle"] .icon-pause { display: none; }
    .gestalt-root[data-autoplay="1"] .ctrl-btn[data-action="autoplay-toggle"] .icon-play { display: none; }
    .gestalt-root[data-autoplay="1"] .ctrl-btn[data-action="autoplay-toggle"] .icon-pause { display: block; }
    .ctrl-btn[data-action="loop-toggle"] { opacity: 0.5; }
    .gestalt-root[data-loop="1"] .ctrl-btn[data-action="loop-toggle"] { opacity: 1; }
    .gestalt-root[data-chrome="0"] .controls-bar,
    .gestalt-root[data-chrome="0"] .caption-bar,
    .gestalt-root[data-chrome="0"] .step-counter { opacity: 0; pointer-events: none; transition: opacity 180ms ease-out; }
    .gestalt-root[data-chrome="1"] .controls-bar,
    .gestalt-root[data-chrome="1"] .caption-bar,
    .gestalt-root[data-chrome="1"] .step-counter { transition: opacity 180ms ease-out; }
    .gestalt-root:fullscreen { width: 100vw; height: 100vh; background: var(--bg); }
    .gestalt-root::backdrop { background: var(--bg); }
    /* A11y: visible focus ring for keyboard navigation. */
    .gestalt-root:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
    .gestalt-root:focus:not(:focus-visible) { outline: none; }
    .ctrl-btn:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
    .ctrl-btn:focus:not(:focus-visible) { outline: none; }
    /* A11y: respect prefers-reduced-motion — animations and step transitions
       collapse to instant updates so users sensitive to motion can still
       follow the sequence without vestibular discomfort. */
    @media (prefers-reduced-motion: reduce) {
      .g-node, .g-edge, .controls-bar, .caption-bar, .step-counter,
      .g-node.is-pulsing { transition: none !important; animation: none !important; }
    }
  </style>
    
  <filter id="shadow-subtle" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.35"/>
  </filter>
  <filter id="shadow-lifted" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.5"/>
  </filter>

    <marker id="mk-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent)"/>
      </marker><marker id="mk-arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--purple)"/>
      </marker>
  </defs>
  <rect width="560" height="315" fill="var(--bg)"/>
  <g class="zoom-root">
    
    
    <g class="g-edge" data-id="a-b">
    <path d="M 132 140.5 L 236 240.5" stroke="var(--accent)" stroke-width="1.25" fill="none" vector-effect="non-scaling-stroke" opacity="0.85" marker-end="url(#mk-arrow-accent)"/>
    
  </g><g class="g-edge" data-id="b-c">
    <path d="M 284 212.5 L 444 90.5" stroke="var(--purple)" stroke-width="1.25" fill="none" vector-effect="non-scaling-stroke" opacity="0.85" marker-end="url(#mk-arrow-purple)"/>
    
  </g>
    
    <g class="g-node" data-id="a" role="img" aria-label="alpha">
      <title>alpha</title>
      <rect x="36" y="112.5" width="96" height="56" rx="0" fill="var(--bg-surface, #202020)" stroke="var(--accent)" stroke-width="1" vector-effect="non-scaling-stroke"/>
      <g class="screen-stable" transform="translate(84,144.5) scale(1)">
        <text text-anchor="middle" font-family="var(--font, monospace)" font-size="13" fill="var(--accent)">alpha</text>
      </g>
      
    </g>
    <g class="g-node" data-id="b" role="img" aria-label="beta">
      <title>beta</title>
      <ellipse cx="284" cy="240.5" rx="48" ry="28" fill="var(--bg-surface, #202020)" stroke="var(--cyan)" stroke-width="1" vector-effect="non-scaling-stroke"/>
      <g class="screen-stable" transform="translate(284,244.5) scale(1)">
        <text text-anchor="middle" font-family="var(--font, monospace)" font-size="13" fill="var(--cyan)">beta</text>
      </g>
      
    </g>
    <g class="g-node" data-id="c" role="img" aria-label="gamma">
      <title>gamma</title>
      
        <path d="M 444 58.5 A 40 12 0 0 0 524 58.5 L 524 122.5 A 40 12 0 0 1 444 122.5 Z" fill="var(--bg-surface, #202020)" stroke="var(--purple)" stroke-width="1" vector-effect="non-scaling-stroke"/>
        <ellipse cx="484" cy="58.5" rx="40" ry="12" fill="var(--bg-surface, #202020)" stroke="var(--purple)" stroke-width="1" vector-effect="non-scaling-stroke"/>
      <g class="screen-stable" transform="translate(484,94.5) scale(1)">
        <text text-anchor="middle" font-family="var(--font, monospace)" font-size="13" fill="var(--purple)">gamma</text>
      </g>
      
    </g>
  </g>
  
  
  
  
</svg>